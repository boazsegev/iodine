# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support documentation.
# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: Windows CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IODINE_LOG_LEVEL: 5

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.2', '3.3', '3.4', '4.0']
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    - name: Setup ENV
      run: |
        echo "CI=false" >> $env:GITHUB_ENV
    - name: Compile Iodine
      run: bundle exec rake compile
    - name: Show which DLL provides Sleep (GVL diagnostic)
      # libruby exports `Sleep` (= rb_w32_Sleep, which takes the GVL) and is
      # linked before kernel32, so C STL spin-waits may bind to it.
      continue-on-error: true
      shell: pwsh
      run: |
        $env:Path = 'C:\msys64\ucrt64\bin;C:\msys64\usr\bin;' + $env:Path
        $so = Get-ChildItem lib -Filter 'iodine.so' -Recurse | Select-Object -First 1
        $dll = ''
        objdump -p $so.FullName | ForEach-Object {
          if ($_ -match 'DLL Name:\s*(\S+)') { $dll = $Matches[1] }
          elseif ($_ -match '\s(Sleep|SleepEx)\s*$') { Write-Host "$($Matches[1]) imported from $dll" }
        }
    - name: Single reactor cycle (minimal teardown repro)
      shell: pwsh
      run: |
        $process = Start-Process cmd.exe -ArgumentList '/c', 'bundle exec rspec spec/single_cycle_spec.rb --format documentation > single_cycle.log 2>&1' -PassThru -NoNewWindow
        if (-not $process.WaitForExit(30000)) {
          Stop-Process -Id $process.Id -Force
          Get-Content single_cycle.log
          throw 'single_cycle_spec did not exit within 30 seconds'
        }
        Get-Content single_cycle.log
        if ($process.ExitCode -ne 0) {
          throw "single_cycle_spec exited with code $($process.ExitCode)"
        }
    - name: Verify connection spec exits promptly
      shell: pwsh
      run: |
        $process = Start-Process cmd.exe -ArgumentList '/c', 'bundle exec rspec spec/connection_spec.rb --format documentation' -PassThru -NoNewWindow
        if (-not $process.WaitForExit(30000)) {
          Stop-Process -Id $process.Id -Force
          throw 'connection_spec did not exit within 30 seconds'
        }
        if ($process.ExitCode -ne 0) {
          throw "connection_spec exited with code $($process.ExitCode)"
        }
    - name: Run tests
      run: bundle exec rake spec
