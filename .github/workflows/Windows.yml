# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: Windows CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.2', '3.3', '3.4', '4.0']
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    - name: Setup ENV
      run: |
        echo "CI=false" >> $env:GITHUB_ENV
    - name: Compile Iodine
      shell: pwsh
      run: |
        $output = @(& bundle exec rake compile 2>&1)
        $status = $LASTEXITCODE
        $output | Write-Output
        if ($status -ne 0) {
          $diagnosticOutput = @($output | Select-Object -Last 120)
          for ($offset = 0; $offset -lt $diagnosticOutput.Count; $offset += 20) {
            $chunkEnd = [Math]::Min($diagnosticOutput.Count - 1, $offset + 19)
            $chunk = @($diagnosticOutput[$offset..$chunkEnd])
            $part = [Math]::Floor($offset / 20) + 1
            $diagnostics = (($chunk -replace '%', '%25') -join '%0A')
            Write-Output "::error title=compile diagnostics part $part::$diagnostics"
          }
          throw "compile exited with code $status"
        }
    - name: Verify reactor without thread pool
      run: >-
        bundle exec ruby -Ilib -e
        "require './lib/iodine'; Iodine.workers = 0; Iodine.threads = 0;
        Iodine.run_after(100) { Iodine.stop }; Iodine.start"
    - name: Diagnose reactor thread teardown
      shell: pwsh
      run: |
        $script = Join-Path $env:RUNNER_TEMP 'reactor-thread-cycle.rb'
        $stdout = Join-Path $env:RUNNER_TEMP 'reactor-thread-cycle.stdout.log'
        $stderr = Join-Path $env:RUNNER_TEMP 'reactor-thread-cycle.stderr.log'
        @'
        require './lib/iodine'
        Iodine.workers = 0
        Iodine.threads = 1
        Iodine.run_after(100) { Iodine.stop }
        Iodine.start
        '@ | Set-Content -Path $script -Encoding utf8
        $command = "bundle exec ruby -Ilib `"$script`""
        $process = Start-Process cmd.exe -ArgumentList '/c', $command -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
        if (-not $process.WaitForExit(30000)) {
          Stop-Process -Id $process.Id -Force
          Write-Output "::error title=reactor thread diagnostics::minimal reactor did not exit within 30 seconds"
          throw 'minimal reactor did not exit within 30 seconds'
        }
        $output = @()
        $output += @(Get-Content $stdout)
        $output += @(Get-Content $stderr)
        $output = $output | Where-Object { $_ }
        $output | Write-Output
        if ($process.ExitCode -ne 0) {
          $bugIndex = -1
          for ($index = 0; $index -lt $output.Count; $index++) {
            if ($output[$index] -match '\[BUG\]') {
              $bugIndex = $index
              break
            }
          }
          if ($bugIndex -ge 0) {
            $diagnosticEnd = [Math]::Min($output.Count - 1, $bugIndex + 159)
            $diagnosticOutput = @($output[$bugIndex..$diagnosticEnd])
          } else {
            $diagnosticOutput = @($output | Select-Object -Last 100)
          }
          for ($offset = 0; $offset -lt $diagnosticOutput.Count; $offset += 20) {
            $chunkEnd = [Math]::Min($diagnosticOutput.Count - 1, $offset + 19)
            $chunk = @($diagnosticOutput[$offset..$chunkEnd])
            $part = [Math]::Floor($offset / 20) + 1
            $diagnostics = (($chunk -replace '%', '%25') -join '%0A')
            Write-Output "::error title=reactor thread diagnostics part $part::$diagnostics"
          }
          throw "minimal reactor exited with code $($process.ExitCode)"
        }
    - name: Run tests
      run: bundle exec rake spec
