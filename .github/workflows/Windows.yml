# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: Windows CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.2', '3.3', '3.4', '4.0']
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    - name: Setup ENV
      run: |
        echo "CI=false" >> $env:GITHUB_ENV
    - name: Compile Iodine
      run: bundle exec rake compile
    - name: Verify connection spec exits promptly
      shell: pwsh
      run: |
        $stdout = Join-Path $env:RUNNER_TEMP 'connection-spec.stdout.log'
        $stderr = Join-Path $env:RUNNER_TEMP 'connection-spec.stderr.log'
        $process = Start-Process cmd.exe -ArgumentList '/c', 'bundle exec rspec spec/connection_spec.rb --format documentation' -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
        if (-not $process.WaitForExit(30000)) {
          Stop-Process -Id $process.Id -Force
          Write-Output "::error title=connection_spec diagnostics::connection_spec did not exit within 30 seconds"
          throw 'connection_spec did not exit within 30 seconds'
        }
        $output = @((Get-Content $stdout), (Get-Content $stderr)) | Where-Object { $_ }
        $output | Write-Output
        if ($process.ExitCode -ne 0) {
          $diagnosticOutput = $output | Where-Object { $_ -match 'TRACE_DESTROY|FATAL|NoMethodError|examples|failures' }
          $diagnostics = ((($diagnosticOutput | Select-Object -Last 30) -replace '%', '%25') -join '%0A')
          Write-Output "::error title=connection_spec diagnostics::$diagnostics"
          throw "connection_spec exited with code $($process.ExitCode)"
        }
    - name: Run tests
      run: bundle exec rake spec
