# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support documentation.
# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: Windows CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IODINE_LOG_LEVEL: 5

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.2', '3.3', '3.4', '4.0']
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    - name: Setup ENV
      run: |
        echo "CI=false" >> $env:GITHUB_ENV
    - name: Compile Iodine
      run: bundle exec rake compile
    - name: Single reactor cycle (minimal teardown repro)
      shell: pwsh
      run: |
        $process = Start-Process cmd.exe -ArgumentList '/c', 'bundle exec rspec spec/single_cycle_spec.rb --format documentation > single_cycle.log 2>&1' -PassThru -NoNewWindow
        if (-not $process.WaitForExit(30000)) {
          Stop-Process -Id $process.Id -Force
          Get-Content single_cycle.log
          throw 'single_cycle_spec did not exit within 30 seconds'
        }
        Get-Content single_cycle.log
        if ($process.ExitCode -ne 0) {
          throw "single_cycle_spec exited with code $($process.ExitCode)"
        }
    - name: Verify connection spec exits promptly
      shell: pwsh
      run: |
        $process = Start-Process cmd.exe -ArgumentList '/c', 'bundle exec rspec spec/connection_spec.rb --format documentation' -PassThru -NoNewWindow
        if (-not $process.WaitForExit(30000)) {
          Stop-Process -Id $process.Id -Force
          throw 'connection_spec did not exit within 30 seconds'
        }
        if ($process.ExitCode -ne 0) {
          throw "connection_spec exited with code $($process.ExitCode)"
        }
    - name: Run tests
      run: bundle exec rake spec
    - name: Symbolize crash (only on failure)
      if: failure()
      continue-on-error: true
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        Write-Host '=== crash symbolization (best effort) ==='
        $bindir = (& ruby -e "print RbConfig::CONFIG['bindir']")
        $so = (& ruby -e "print RbConfig::CONFIG['LIBRUBY_SO']")
        $dll = Join-Path $bindir $so
        Write-Host "libruby: $dll"

        # Ruby's [BUG] reporter prints and abort()s the process itself, so no
        # external tool gets a chance to intercept. The spec prints libruby's
        # load base (via Fiddle GetModuleHandleA) before running, so RVAs can
        # be computed from the same log: RVA = VA - base.
        $pattern = [regex]::Escape($so) + '\((\w+)\+0x([0-9a-fA-F]+)\) \[0x([0-9a-fA-F]+)\]'
        $basePattern = 'libruby base address: 0x([0-9a-fA-F]+)'
        $raw = ''
        if (Test-Path 'single_cycle.log') { $raw = Get-Content 'single_cycle.log' -Raw }
        $frames = [regex]::Matches($raw, $pattern)
        $baseMatch = [regex]::Match($raw, $basePattern)

        if (-not $frames.Count -or -not $baseMatch.Success) {
          Write-Host 'frames/base missing from single_cycle.log - re-running single cycle for a fresh crash log'
          bundle exec rspec spec/single_cycle_spec.rb > symbolize_run.log 2>&1
          if (Test-Path 'symbolize_run.log') {
            $raw = Get-Content 'symbolize_run.log' -Raw
            $frames = [regex]::Matches($raw, $pattern)
            $baseMatch = [regex]::Match($raw, $basePattern)
          }
        }

        if (-not $frames.Count) { Write-Host 'no libruby frames found - nothing to symbolize'; exit 0 }

        Write-Host '--- libruby frames (nearest export + offset, ASLR-independent) ---'
        foreach ($m in $frames) { Write-Host ("{0}+0x{1}" -f $m.Groups[1].Value, $m.Groups[2].Value) }

        $env:Path = 'C:\msys64\ucrt64\bin;C:\msys64\mingw64\bin;C:\msys64\usr\bin;' + $env:Path
        $addr2line = Get-Command addr2line -ErrorAction SilentlyContinue
        if (-not $addr2line) { Write-Host 'addr2line not found; resolve the frames above offline with the toolcache DLL'; exit 0 }
        if (-not $baseMatch.Success) { Write-Host 'no base address in log; cannot compute RVAs'; exit 0 }

        $base = [Convert]::ToUInt64($baseMatch.Groups[1].Value, 16)
        Write-Host ("--- addr2line (base 0x{0:x}) ---" -f $base)
        foreach ($m in $frames) {
          $va = [Convert]::ToUInt64($m.Groups[3].Value, 16)
          $rva = $va - $base
          Write-Host ("frame {0}+0x{1} (RVA 0x{2:x}):" -f $m.Groups[1].Value, $m.Groups[2].Value, $rva)
          & addr2line -f -C -e $dll ('0x{0:x}' -f $rva)
        }
        exit 0
